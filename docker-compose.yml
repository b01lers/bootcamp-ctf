#    container_name: bctf-bootcamp
#    build:
#      dockerfile: ./Dockerfile
#      context: .
#    ports:
#      - "9125:3000"
#    restart: always

networks:
  rctf: {}
  traefuck:
    name: traefuck
    external: true
