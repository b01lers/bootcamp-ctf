version: '2.2'
services:
  rctf:
    image: redpwn/rctf:${RCTF_GIT_REF}
    restart: always
    expose:
      - "80"
    networks:
      - rctf
      - traefuck
    env_file:
      - .env
    environment:
      - PORT=80
    volumes:
      - ./conf.d:/app/conf.d
      - ./rctf-overrides/challs-get.js:/app/dist/server/api/challs/get.js:ro
    depends_on:
      - redis
      - postgres
    labels:
      - "traefik.http.routers.bootcamp2025.rule=Host(`bootcamp-ctf.b01lers.net`)"
      - "traefik.http.services.bootcamp2025.loadbalancer.server.port=80"
      - "traefik.http.routers.bootcamp2025.tls={}"
      - "traefik.http.routers.bootcamp2025.entrypoints=websecure"
  redis:
    image: redis:6.0.6
    restart: always
    command: ["redis-server", "--requirepass", "${RCTF_REDIS_PASSWORD}"]
    networks:
      - rctf
    volumes:
      - ./data/rctf-redis:/data
  postgres:
    image: postgres:12.3
    restart: always
    environment:
      - POSTGRES_PASSWORD=${RCTF_DATABASE_PASSWORD}
      - POSTGRES_USER=rctf
      - POSTGRES_DB=rctf
    networks:
      - rctf
    volumes:
      - ./data/rctf-postgres:/var/lib/postgresql/data
